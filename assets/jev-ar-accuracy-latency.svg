<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Jev-AR: accuracy vs. latency</title>
<desc id="d">mE5 + LogReg: 72.4% at 3.9 ms; mmBERT classifier (fine-tuned): 76.5% at 6.3 ms; Laya multilingual (Jev-AR's starting point): 42.0% at 11.1 ms; Jev-AR (322M): 83.4% at 10.1 ms; Jev 1.13 (API): 86.2% at 370 ms; Qwen3.8-27B: 90.0% at 634.1 ms</desc>
<style>
