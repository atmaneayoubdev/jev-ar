<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Gulf-Arabic intent routing: accuracy on 60 routes</title>
<desc id="d">Qwen3.8-27B (27B · 634 ms, round trip): 90.0%; Jev 1.13 (closed API · 370 ms, round trip): 86.2%; Jev-AR (322M · 10 ms): 83.4%; mmBERT classifier (307M · 6 ms): 76.5%; mE5 + LogReg (278M · 4 ms): 72.4%; Laya multilingual (322M · 11 ms): 42.0%</desc>
